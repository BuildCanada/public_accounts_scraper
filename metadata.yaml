          - "From April 2020 to July 2021, price movements for this sub-index were imputed using special approaches. In August 2021, adjustments were introduced on a major component of this sub-index to remove the impact of these imputations. In November 2021, an adjustment was introduced on the remaining imputed component to remove the impact of the imputations on that component. Users are advised to exercise caution in interpreting the 1-month change for August 2021 and November 2021, and the 12-month change for the next 12 months for the travel tours index. The details of these treatments from April 2020 to March 2021 are provided in technical supplements available through the Prices Analytical Series (opens new window). Starting in April 2021
          - "Available starting April 2022. In order to have historical data prior to April 2022, users can use the purchase of passenger vehicles index values as proxies. Please note that the purchase of passenger vehicles index values are based on 2002=100 while this series is 2022-04=100. Therefore, users should rebase the purchase of passenger vehicles index values that are based on 2002=100, to 2022-04=100 in order to make the series continuous. For more information on rebasing, you can consult section 8.25 of The Consumer Price Index Reference Paper (opens new window)."
          - With the release of the Consumer Price Index (CPI) of May 2023,  the classification of the fresh fruit category has been updated to provide Canadians with more granular data. Previously included in the other fresh fruit category, citrus (excluding oranges), grapes and berries (including cherries) are now published. As a result, data for other fresh fruit beginning in May 2023 are no longer directly comparable to earlier time periods.
          - With the release of the Consumer Price Index (CPI) of May 2023, the classification of the fresh vegetables category has been updated to provide Canadians with more granular data. Previously included in the other fresh vegetables category, carrots, onions, peppers, cucumber and mushrooms are now published. As a result, data for other fresh vegetables beginning in May 2023 are no longer directly comparable to earlier time periods.
          - As access to more granular data has become available, the cellular services index is now published at the provincial level in addition to the national level. Changes over time in the cellular services index at the national level may be calculated using index data from any of the two base periods (2017=100 or 202304=100).
          - With the release of the Consumer Price Index (CPI) of August 2024, the cellular services price index has been updated to incorporate transaction data from wireless service providers. This enhancement improves the quality of the data, while ensuring the representativeness of prices paid by Canadian consumers. Users should exercise caution when interpreting the year-over-year change for the first 12 months following the implementation of a new methodology and data source.
          - With the release of the Consumer Price Index (CPI) of August 2024, the cellular services price index has been updated to incorporate transaction data from wireless service providers. This enhancement improves the quality of the data, while ensuring the representativeness of prices paid by Canadian consumers. Users should exercise caution when interpreting the year-over-year change for the first 12 months following the implementation of a new methodology and data source. Users are also advised to exercise caution when making provincial/territorial comparisons. The market shares of the sampled wireless service providers vary across provinces and territories and price changes derived from transaction data may differ from price changes derived from web-collected data as transaction data includes monthly charges for in-market and legacy plans, while web-collected data only contains monthly charges for advertised plans. The hybrid cellular services price index in each province or territory is affected by the market shares of the wireless service providers from which Statistics Canada is receiving transaction data.
