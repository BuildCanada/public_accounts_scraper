      statscan_population_july1:
        title: Population estimates on July 1, by age and gender
        description_html: |-
          Population estimates on July 1, by age and gender

          Frequency: Annual
          Coverage: 1971-01-01 to 2025-01-01

          Dimensions: Geography, Gender, Age group

          Notes:
          - Postcensal estimates are based on the 2021 Census counts adjusted for census net undercoverage (CNU) (including adjustment for incompletely enumerated reserves and settlements (IERS)) and the components of demographic growth that occurred since that census. Intercensal estimates are produced using counts from two consecutive censuses adjusted for CNU (including IERS) and postcensal estimates.
          - Estimates are final intercensal up to 2020, final postcensal for 2021, updated postcensal for 2022, 2023 and 2024, and preliminary postcensal for 2025.
          - Population estimates for Northwest Territories and Nunavut are presented separately from 1991.
          - Prior to 1991, only estimates of population for Northwest Territories and Nunavut combined are available.
          - Age at last birthday in years.
          - Data for persons aged 90 to 100 years and older will be available from 2001.
          - The population growth, which is used to calculate population estimates, is comprised of natural increase (Tables 17100006 and 17100016), international migration (Table 17100014) and interprovincial migration (Table 17100015).
          - "The demographic estimates now incorporate the concept of gender, which was first introduced in the 2021 Census of Population. Gender refers to an individual's personal and social identity as a man, woman or non-binary person (a person who is not exclusively a man or a woman). Demographic estimates are available for the gender category "Men+"
